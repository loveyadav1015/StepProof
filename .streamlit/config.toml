[theme]
primaryColor = "#3B82F6"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#181818"
textColor = "#F5F5F5"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
maxUploadSize = 50
corsAllowedOrigins = [
    "http://localhost:8000",
    "http://127.0.0.1:8000",
    "http://localhost:8501",
    "http://127.0.0.1:8501",
    "http://localhost:3000",
    "http://127.0.0.1:3000"
]

