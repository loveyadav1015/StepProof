name: Deploy Static Documentation & Landing Page

on:
  # Workflow is defined for GitHub Pages deployment.
  # Trigger manually via workflow_dispatch; push trigger can be enabled by user in repo settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies for site builder
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Build static site
        run: |
          python scripts/build_site.py

      - name: Verify site size and asset safety boundaries
        run: |
          echo "Verifying docs/site asset boundaries..."
          
          # 1. Fail if docs/site contains any file over 5 MB (5,242,880 bytes)
          find docs/site -type f -size +5242880c -print -exec false {} +
          
          # 2. Fail if docs/site links or contains raw data/ or weights/
          if find docs/site -name "*data*" -o -name "*weights*" | grep -q .; then
            echo "❌ Error: Forbidden reference or directory found in docs/site."
            exit 1
          fi
          
          echo "✅ Asset size and safety boundaries verified."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
