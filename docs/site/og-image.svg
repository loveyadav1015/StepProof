<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Dark flat background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Subtle border outline -->
  <rect x="20" y="20" width="1160" height="590" rx="16" stroke="#272727" stroke-width="2"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.15">
    <line x1="80" y1="120" x2="1120" y2="120" stroke="#383838" stroke-width="1"/>
    <line x1="80" y1="510" x2="1120" y2="510" stroke="#383838" stroke-width="1"/>
    <line x1="400" y1="80" x2="400" y2="550" stroke="#383838" stroke-width="1"/>
    <line x1="800" y1="80" x2="800" y2="550" stroke="#383838" stroke-width="1"/>
  </g>

  <!-- Tag / Status Pill -->
  <g transform="translate(80, 80)">
    <rect width="210" height="36" rx="18" fill="#181818" stroke="#383838" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#3B82F6"/>
    <text x="36" y="23" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">INDUSTRIAL VIDEO SOP</text>
  </g>

  <!-- Title -->
  <text x="80" y="210" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="600">StepProof</text>
  
  <!-- Subtitle / Tagline -->
  <text x="80" y="280" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="400">
    Turn one expert video into a verified procedure,
  </text>
  <text x="80" y="324" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="400">
    and catch mistakes as they happen.
  </text>

  <!-- 3 Pillars Cards -->
  <g transform="translate(80, 390)">
    <!-- Card 1 -->
    <rect width="320" height="120" rx="8" fill="#181818" stroke="#272727" stroke-width="1"/>
    <text x="24" y="44" fill="#3B82F6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">01 / DISCOVERY</text>
    <text x="24" y="76" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Learn From One Video</text>
    <text x="24" y="98" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Structured SOP extraction</text>

    <!-- Card 2 -->
    <g transform="translate(350, 0)">
      <rect width="320" height="120" rx="8" fill="#181818" stroke="#272727" stroke-width="1"/>
      <text x="24" y="44" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">02 / GROUNDING</text>
      <text x="24" y="76" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Ground In The Image</text>
      <text x="24" y="98" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Zero-shot SAM 3.1 segmentation</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(700, 0)">
      <rect width="340" height="120" rx="8" fill="#181818" stroke="#272727" stroke-width="1"/>
      <text x="24" y="44" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600">03 / VERIFICATION</text>
      <text x="24" y="76" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">Check A Learner</text>
      <text x="24" y="98" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Multi-frame temporal smoothing</text>
    </g>
  </g>

  <!-- Footer Meta info -->
  <text x="80" y="565" fill="#525252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">
    Built for the Meta AI Hackathon • Industrial Video Verification &amp; Training
  </text>
</svg>
